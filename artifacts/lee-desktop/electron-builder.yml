appId: com.lamontlabs.projectlee
productName: Project LEE
artifactName: Project-LEE-Setup-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - resources/**
  - "!**/*.map"
extraResources:
  - from: resources/api-server
    to: api-server
  - from: resources/console
    to: console
  - from: resources/postgres
    to: postgres
linux:
  target:
    - dir
  category: Utility
  executableName: Project-LEE
win:
  icon: resources/lee.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Project LEE
  runAfterFinish: true
publish:
  provider: github
  releaseType: release