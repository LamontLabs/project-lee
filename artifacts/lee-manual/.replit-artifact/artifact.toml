kind = "web"
previewPath = "/"
title = "Project LEE Manual"
version = "1.0.0"
id = "artifacts/lee-manual"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22689

[services.development]
run = "pnpm --filter @workspace/lee-manual run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lee-manual", "run", "build" ]
publicDir = "artifacts/lee-manual/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22689"
BASE_PATH = "/"
