kind = "mobile"
previewPath = "/lee-android/"
title = "Lee Android Companion"
description = "A dark-mode Android companion for Project LEE with device pairing, quick capture, a daily brief, waiting loops, alerts, questions, and approval review."
version = "1.0.0"
id = "artifacts/lee-android"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/lee-android/" ]
localPort = 22028

[services.development]
run = "pnpm --filter @workspace/lee-android run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lee-android", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lee-android", "run", "serve" ]

[services.env]
PORT = "22028"
BASE_PATH = "/lee-android/"
