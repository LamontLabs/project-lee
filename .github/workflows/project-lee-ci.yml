name: Project LEE CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-lee-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build Console
        run: pnpm --filter @workspace/lee-console run build
        env:
          PORT: 4173
          BASE_PATH: /

      - name: Typecheck desktop
        run: pnpm --filter @workspace/lee-desktop run typecheck

      - name: Run desktop contract checks
        run: |
          pnpm --filter @workspace/lee-desktop run test:release-metadata
          pnpm --filter @workspace/lee-desktop run test:runtime-contract
