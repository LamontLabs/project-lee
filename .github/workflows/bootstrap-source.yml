name: Bootstrap Project LEE Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source checkout
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf project-lee-source.tar.gz
          rm -f project-lee-source.tar.gz .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Project LEE source checkout"
          git push origin HEAD:main
