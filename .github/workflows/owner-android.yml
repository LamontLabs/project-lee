name: Project LEE Owner Android

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/owner-android.yml
      - artifacts/lee-android/**
      - lib/api-client-react/**
      - lib/api-zod/**
      - lib/mobile-foundation/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  owner-android:
    name: Validate and build Owner debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_DOMAIN: project-lee.replit.app
    steps:
      - name: Check out Owner repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate canonical hosted Core endpoint
        shell: bash
        run: |
          set -euo pipefail
          domain="${EXPO_PUBLIC_DOMAIN:-}"
          if [[ -z "$domain" || "${domain,,}" == "core.invalid" || "${domain,,}" == *.invalid ]]; then
            echo "::error::EXPO_PUBLIC_DOMAIN must be set to the canonical hosted Project LEE Core hostname."
            exit 1
          fi
          if [[ ! "$domain" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::EXPO_PUBLIC_DOMAIN must be a hostname only; do not include a scheme, port, or API path."
            exit 1
          fi
          response_file="$(mktemp)"
          if ! status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output "$response_file" --write-out '%{http_code}' "https://${domain}/api/healthz")"; then
            echo "::error::Configured Project LEE Core host is not reachable."
            rm -f "$response_file"
            exit 1
          fi
          if [[ "$status" == "200" ]]; then
            if ! node -e '
              const fs = require("node:fs");
              let health;
              try { health = JSON.parse(fs.readFileSync(0, "utf8")); } catch { process.exit(1); }
              if (health.status !== "ok" || health.live !== true) process.exit(1);
            ' < "$response_file"; then
              echo "::error::Configured host did not return the Project LEE Core liveness contract."
              rm -f "$response_file"
              exit 1
            fi
            echo "Canonical Core host is reachable; liveness verified, readiness not inferred."
          elif [[ "$status" == "401" || "$status" == "403" ]]; then
            echo "Canonical Core host is reachable and protected; readiness is not inferred."
          else
            echo "::error::Canonical Core host returned unexpected HTTP ${status}."
            rm -f "$response_file"
            exit 1
          fi
          rm -f "$response_file"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Owner and shared checks
        run: |
          pnpm exec tsc -b lib/api-client-react lib/api-zod lib/mobile-foundation
          pnpm --filter @workspace/lee-android run typecheck
          pnpm --filter @workspace/lee-android run test:owner

      - name: Create ephemeral debug signing key
        run: pnpm --filter @workspace/lee-android run ensure-debug-keystore

      - name: Assemble installable Owner release APK
        working-directory: artifacts/lee-android/android
        run: bash gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify package identity and APK output
        run: |
          apk=artifacts/lee-android/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          grep -q "applicationId 'com.projectlee.owner'" artifacts/lee-android/android/app/build.gradle
          test "$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")" = "com.projectlee.owner"
          unzip -l "$apk" | grep -Eq "assets/index.android.bundle($|\\.hbc|\\.packager\\.map)"

      - name: Upload Owner test APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-LEE-Owner-Android-Test
          path: artifacts/lee-android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error