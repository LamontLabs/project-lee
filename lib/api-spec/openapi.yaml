openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: understanding
    description: Source ingestion and knowledge extraction
  - name: reasoning
    description: Context budgeting and model routing
  - name: connectors
    description: Read-only provider synchronization and normalization
  - name: costs
    description: Reasoning usage and cost accounting
  - name: brain-versions
    description: Checksummed brain snapshots and restore verification
  - name: scheduler
    description: Persisted orchestration jobs and scheduler calendar
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /understanding/runs:
    post:
      operationId: createUnderstandingRun
      tags: [understanding]
      summary: Process a source through the understanding pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnderstandingRunInput"
      responses:
        "201":
          description: Completed understanding run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnderstandingRunResult"
        "400":
          description: Invalid source input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listUnderstandingRuns
      tags: [understanding]
      summary: List recent understanding runs
      responses:
        "200":
          description: Recent runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnderstandingRunSummary"
  /reasoning/route:
    post:
      operationId: routeReasoningRequest
      tags: [reasoning]
      summary: Route a reasoning request through the context economy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasoningRequestInput"
      responses:
        "200":
          description: Routed reasoning result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReasoningRouteResult"
        "400":
          description: Invalid reasoning request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /connectors/sync:
    post:
      operationId: syncConnector
      tags: [connectors]
      summary: Normalize a read-only provider sync batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorSyncInput"
      responses:
        "201":
          description: Connector sync completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorSyncResult"
        "400":
          description: Invalid connector payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Write operation requires CerbaSeal authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /connectors/health:
    get:
      operationId: listConnectorHealth
      tags: [connectors]
      summary: List connector health
      responses:
        "200":
          description: Connector health signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorHealth"
  /costs/summary:
    get:
      operationId: getCostSummary
      tags: [costs]
      summary: Summarize recorded reasoning costs
      responses:
        "200":
          description: Cost summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSummary"
  /brain-versions:
    post:
      operationId: createBrainVersion
      tags: [brain-versions]
      summary: Create and verify a checksummed brain snapshot
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrainVersionInput"
      responses:
        "201":
          description: Brain snapshot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainVersion"
    get:
      operationId: listBrainVersions
      tags: [brain-versions]
      summary: List brain snapshots
      responses:
        "200":
          description: Brain snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrainVersionSummary"
  /brain-versions/{id}/restore:
    post:
      operationId: restoreBrainVersion
      tags: [brain-versions]
      summary: Verify a snapshot and initiate a restore preflight
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreBrainVersionInput"
      responses:
        "200":
          description: Restore verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreBrainVersionResult"
        "404":
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /scheduler/jobs:
    post:
      operationId: scheduleJob
      tags: [scheduler]
      summary: Schedule a persisted orchestration job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleJobInput"
      responses:
        "201":
          description: Job scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledJob"
    get:
      operationId: listScheduledJobs
      tags: [scheduler]
      summary: Query the scheduler calendar
      responses:
        "200":
          description: Scheduled jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledJob"
  /scheduler/jobs/{id}/run:
    post:
      operationId: runScheduledJob
      tags: [scheduler]
      summary: Run a scheduled job and record its lifecycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job completed or failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledJobRunResult"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    UnderstandingRunInput:
      type: object
      properties:
        sourceType:
          type: string
          minLength: 1
          maxLength: 64
          description: Type of source being ingested, such as note, email, document, or message.
        sourceRef:
          type: string
          minLength: 1
          description: Stable reference to the source. Required for every emitted record.
        sourceReliability:
          type: string
          enum: [high, medium, low]
          default: medium
        content:
          type: string
          minLength: 1
          maxLength: 200000
        metadata:
          type: object
          additionalProperties: true
      required: [sourceType, sourceRef, content]
    ExtractedFact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        predicate:
          type: string
        object:
          type: string
        sourceRef:
          type: string
        confidence:
          type: number
        provenanceId:
          type: string
          format: uuid
      required: [id, subject, predicate, object, sourceRef, confidence, provenanceId]
    ExtractedInterpretation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        statement:
          type: string
        basis:
          type: string
        sourceRef:
          type: string
        confidence:
          type: number
        provenanceId:
          type: string
          format: uuid
      required: [id, statement, basis, sourceRef, confidence, provenanceId]
    UnderstandingRunSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceType:
          type: string
        sourceRef:
          type: string
        status:
          type: string
        factCount:
          type: integer
        interpretationCount:
          type: integer
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
      required: [id, sourceType, sourceRef, status, factCount, interpretationCount, startedAt]
    UnderstandingRunResult:
      allOf:
        - $ref: "#/components/schemas/UnderstandingRunSummary"
        - type: object
          properties:
            facts:
              type: array
              items:
                $ref: "#/components/schemas/ExtractedFact"
            interpretations:
              type: array
              items:
                $ref: "#/components/schemas/ExtractedInterpretation"
            eventId:
              type: string
              format: uuid
          required: [facts, interpretations, eventId]
    ReasoningContextItem:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        kind:
          type: string
          minLength: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        recencyDays:
          type: number
          minimum: 0
        strategicAnchor:
          type: boolean
      required: [id, text, kind, confidence, recencyDays, strategicAnchor]
    ReasoningRequestInput:
      type: object
      properties:
        queryText:
          type: string
          minLength: 1
          maxLength: 20000
        semanticDomain:
          type: string
          minLength: 1
        intentType:
          type: string
          minLength: 1
        riskClassification:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        contextItems:
          type: array
          items:
            $ref: "#/components/schemas/ReasoningContextItem"
        contextBudgetTokens:
          type: integer
          minimum: 128
          maximum: 32000
          default: 2000
        costCeilingUsd:
          type: number
          minimum: 0
        preferredTier:
          type: string
          enum: [auto, T1, T2, T3]
          default: auto
      required: [queryText, semanticDomain, intentType, riskClassification, contextItems]
    SelectedContextItem:
      allOf:
        - $ref: "#/components/schemas/ReasoningContextItem"
        - type: object
          properties:
            score:
              type: number
            estimatedTokens:
              type: integer
          required: [score, estimatedTokens]
    ReasoningRouteResult:
      type: object
      properties:
        correlationId:
          type: string
          format: uuid
        resolutionTier:
          type: string
          enum: [T1, T2, T3]
        model:
          type: string
        answer:
          type: string
        contextPacket:
          type: array
          items:
            $ref: "#/components/schemas/SelectedContextItem"
        contextTokens:
          type: integer
        contextBudgetTokens:
          type: integer
        estimatedCostUsd:
          type: number
        eventId:
          type: string
          format: uuid
      required: [correlationId, resolutionTier, model, answer, contextPacket, contextTokens, contextBudgetTokens, estimatedCostUsd, eventId]
    ConnectorProvider:
      type: string
      enum: [gmail, proton, github, google_drive, google_calendar]
    ConnectorEventInput:
      type: object
      properties:
        externalId:
          type: string
          minLength: 1
        eventType:
          type: string
          minLength: 1
        sourceRef:
          type: string
          minLength: 1
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
      required: [externalId, eventType, sourceRef, occurredAt, payload]
    ConnectorSyncInput:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/ConnectorProvider"
        mode:
          type: string
          enum: [read, write]
          default: read
        events:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ConnectorEventInput"
      required: [provider, events]
    ConnectorSyncResult:
      type: object
      properties:
        syncId:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/ConnectorProvider"
        status:
          type: string
        receivedCount:
          type: integer
        normalizedCount:
          type: integer
        eventIds:
          type: array
          items:
            type: string
            format: uuid
        domainEventId:
          type: string
          format: uuid
      required: [syncId, provider, status, receivedCount, normalizedCount, eventIds, domainEventId]
    ConnectorHealth:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/ConnectorProvider"
        accessMode:
          type: string
        status:
          type: string
        lastSyncAt:
          type: string
          format: date-time
        lastError:
          type: string
      required: [provider, accessMode, status]
    CostTierSummary:
      type: object
      properties:
        tier:
          type: string
        requestCount:
          type: integer
        totalTokens:
          type: integer
        estimatedCostUsd:
          type: number
      required: [tier, requestCount, totalTokens, estimatedCostUsd]
    CostSummary:
      type: object
      properties:
        requestCount:
          type: integer
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        totalTokens:
          type: integer
        estimatedCostUsd:
          type: number
        byTier:
          type: array
          items:
            $ref: "#/components/schemas/CostTierSummary"
      required: [requestCount, promptTokens, completionTokens, totalTokens, estimatedCostUsd, byTier]
    CreateBrainVersionInput:
      type: object
      properties:
        versionName:
          type: string
          minLength: 1
          maxLength: 160
    BrainVersionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        versionName:
          type: string
        schemaVersion:
          type: string
        status:
          type: string
        checksum:
          type: string
        totalRecords:
          type: integer
        createdAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
      required: [id, versionName, schemaVersion, status, checksum, totalRecords, createdAt]
    BrainVersion:
      allOf:
        - $ref: "#/components/schemas/BrainVersionSummary"
        - type: object
          properties:
            recordCounts:
              type: object
              additionalProperties:
                type: integer
            payload:
              type: object
              additionalProperties: true
          required: [recordCounts, payload]
    RestoreBrainVersionInput:
      type: object
      properties:
        confirm:
          type: boolean
          default: false
    RestoreBrainVersionResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        checksumValid:
          type: boolean
        status:
          type: string
        dryRun:
          type: boolean
        message:
          type: string
        eventId:
          type: string
          format: uuid
      required: [id, checksumValid, status, dryRun, message, eventId]
    ScheduleJobInput:
      type: object
      properties:
        jobType:
          type: string
          minLength: 1
          maxLength: 96
        runAt:
          type: string
          format: date-time
        recurrence:
          type: string
        dependencies:
          type: array
          items:
            type: string
            format: uuid
        payload:
          type: object
          additionalProperties: true
      required: [jobType, runAt]
    ScheduledJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobType:
          type: string
        status:
          type: string
        runAt:
          type: string
          format: date-time
        recurrence:
          type: string
        dependencies:
          type: array
          items:
            type: string
            format: uuid
        attempts:
          type: integer
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
      required: [id, jobType, status, runAt, dependencies, attempts, createdAt, updatedAt]
    ScheduledJobRunResult:
      type: object
      properties:
        job:
          $ref: "#/components/schemas/ScheduledJob"
        eventId:
          type: string
          format: uuid
        message:
          type: string
      required: [job, eventId, message]

