name: Project LEE Owner Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  owner-android:
    name: Validate and build Owner debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Owner repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Owner and shared checks
        working-directory: project-lee-owner-android
        run: |
          pnpm --filter @workspace/mobile-foundation exec tsc -p tsconfig.json --noEmit
          pnpm exec tsc -b packages/api-client-react packages/api-zod packages/mobile-foundation
          pnpm run typecheck
          pnpm run test:owner

      - name: Create ephemeral debug signing key
        working-directory: project-lee-owner-android
        run: pnpm run ensure-debug-keystore

      - name: Assemble installable Owner release APK
        working-directory: project-lee-owner-android/android
        env:
          EXPO_PUBLIC_DOMAIN: core.invalid
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify package identity and APK output
        run: |
          apk=project-lee-owner-android/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          grep -q "applicationId 'com.projectlee.owner'" project-lee-owner-android/android/app/build.gradle
          unzip -l "$apk" | grep -Eq "assets/index.android.bundle($|\\.hbc|\\.packager\\.map)"

      - name: Upload Owner test APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-LEE-Owner-Android-Test
          path: project-lee-owner-android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error