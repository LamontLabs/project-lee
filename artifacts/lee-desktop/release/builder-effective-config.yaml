directories:
  output: release
  buildResources: resources
appId: com.lamontlabs.projectlee
productName: Project LEE
artifactName: Project-LEE-Setup-${version}-${arch}.${ext}
files:
  - filter:
      - dist/**
      - resources/**
      - '!**/*.map'
extraResources:
  - from: resources/api-server
    to: api-server
  - from: resources/console
    to: console
linux:
  icon: resources/lee.png
  target:
    - AppImage
    - deb
  category: Utility
  executableName: Project-LEE
  syncDesktopName: true
  synopsis: Private founder operating system
mac:
  icon: resources/lee.png
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  icon: resources/lee.png
  extraResources:
    - from: resources/postgres
      to: postgres
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Project LEE
  runAfterFinish: true
  differentialPackage: true
publish:
  provider: github
  releaseType: release
electronVersion: 38.8.6
