name: Project LEE Desktop Release

on:
  push:
    tags:
      - "lee-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-release-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require a valid release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || { echo "Desktop releases must run from a lee-v* tag, not $GITHUB_REF_NAME." >&2; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^lee-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag: $GITHUB_REF_NAME. Expected lee-vMAJOR.MINOR.PATCH." >&2
            exit 1
          }
  windows-installer:
    needs: validate-release-ref
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set release version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == lee-v* ]]; then
            VERSION="${GITHUB_REF_NAME#lee-v}"
            node -e "const fs=require('fs'); const p='artifacts/lee-desktop/package.json'; const data=JSON.parse(fs.readFileSync(p,'utf8')); data.version=process.argv[1]; fs.writeFileSync(p, JSON.stringify(data,null,2)+'\n')" "$VERSION"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-zod exec tsc -p tsconfig.json
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/lee-console run build
        env:
          PORT: 4173
          BASE_PATH: /
      - name: Stage private PostgreSQL runtime
        shell: pwsh
        run: |
          $version = "17.6-1"
          $archive = "$env:RUNNER_TEMP\postgresql-$version-windows-x64-binaries.zip"
          Invoke-WebRequest "https://get.enterprisedb.com/postgresql/postgresql-$version-windows-x64-binaries.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP\postgresql"
          node artifacts/lee-desktop/scripts/stage-postgres-runtime.mjs --platform windows --source "$env:RUNNER_TEMP\postgresql\pgsql"
      - name: Require Windows signing configuration
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.LEE_WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.LEE_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) { throw "LEE_WINDOWS_CERTIFICATE is required for a trusted release." }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) { throw "LEE_WINDOWS_CERTIFICATE_PASSWORD is required for a trusted release." }
      - name: Prepare public Windows signing certificate for CI verification
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.LEE_WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.LEE_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $trustEvidencePath = Join-Path $env:GITHUB_WORKSPACE "windows-certificate-trust-evidence.json"
          $trustEvidence = [ordered]@{
            status = "running"
            phase = "initialize"
            startedAt = [DateTime]::UtcNow.ToString("o")
            failedStore = $null
            stores = @()
            markers = @()
            storeMutation = "not-performed"
          }
          function Write-TrustEvidence {
            $trustEvidence | ConvertTo-Json -Depth 20 | Set-Content -Path $trustEvidencePath -Encoding utf8
          }
          function Write-TrustMarker([string] $phase, [string] $message) {
            $trustEvidence.phase = $phase
            $trustEvidence.markers += [ordered]@{
              at = [DateTime]::UtcNow.ToString("o")
              phase = $phase
              message = $message
            }
            Write-Host "[certificate-trust] $phase - $message"
            Write-TrustEvidence
          }
          try {
            Write-TrustMarker "decode-certificate" "Decoding the CI signing certificate."
            $sourcePfxPath = Join-Path $env:RUNNER_TEMP "project-lee-signing-source.pfx"
            $pfxPath = Join-Path $env:RUNNER_TEMP "project-lee-signing-release.pfx"
            $privateKeyPath = Join-Path $env:RUNNER_TEMP "project-lee-signing.key.pem"
            $opensslCertificatePath = Join-Path $env:RUNNER_TEMP "project-lee-signing.release.cer"
            $opensslConfigPath = Join-Path $env:RUNNER_TEMP "project-lee-signing.openssl.cnf"
            $certificatePath = Join-Path $env:RUNNER_TEMP "project-lee-signing.cer"
            $bytes = [Convert]::FromBase64String(($env:CSC_LINK -replace '\s', ''))
            [IO.File]::WriteAllBytes($sourcePfxPath, $bytes)
            $sourceCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $bytes,
              $env:CSC_KEY_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            )
            $openssl = (Get-Command openssl.exe -ErrorAction Stop).Source
            & $openssl pkcs12 -in $sourcePfxPath -nocerts -nodes -passin env:CSC_KEY_PASSWORD -out $privateKeyPath 2>$null
            if ($LASTEXITCODE -ne 0) {
              Remove-Item $privateKeyPath -Force -ErrorAction SilentlyContinue
              & $openssl pkcs12 -legacy -in $sourcePfxPath -nocerts -nodes -passin env:CSC_KEY_PASSWORD -out $privateKeyPath 2>$null
            }
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL could not extract the CI signing key." }
            @(
              "[req]"
              "distinguished_name = distinguished_name"
              "x509_extensions = extensions"
              "prompt = no"
              ""
              "[distinguished_name]"
              "CN = $($sourceCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false))"
              ""
              "[extensions]"
              "basicConstraints = critical,CA:true"
              "keyUsage = critical,keyCertSign,digitalSignature"
              "extendedKeyUsage = codeSigning"
              "subjectKeyIdentifier = hash"
              "authorityKeyIdentifier = keyid:always"
            ) | Set-Content $opensslConfigPath -Encoding utf8
            & $openssl req -new -x509 -sha256 -days 3650 -key $privateKeyPath -out $opensslCertificatePath -config $opensslConfigPath 2>$null
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL could not create the CA-capable CI signing certificate." }
            & $openssl pkcs12 -export -out $pfxPath -inkey $privateKeyPath -in $opensslCertificatePath -passout env:CSC_KEY_PASSWORD -name "Project LEE Internal" 2>$null
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL could not package the CA-capable CI signing certificate." }
            $releaseBytes = [IO.File]::ReadAllBytes($pfxPath)
            $env:CSC_LINK = [Convert]::ToBase64String($releaseBytes)
            "CSC_LINK=$($env:CSC_LINK)" | Add-Content $env:GITHUB_ENV -Encoding utf8
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $releaseBytes,
              $env:CSC_KEY_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            )
            [IO.File]::WriteAllBytes(
              $certificatePath,
              $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
            )
            Write-TrustMarker "package-certificate" "Copying the public certificate into the packaged resources."
            Copy-Item $certificatePath "$env:GITHUB_WORKSPACE\artifacts\lee-desktop\resources\lee-signing.cer" -Force
            $trustEvidence.certificate = [ordered]@{
              subject = $certificate.Subject
              thumbprint = $certificate.Thumbprint.ToUpperInvariant()
              privateKeyPresent = $false
              source = "CA-capable certificate generated from the CI signing key"
              sourceCertificate = $sourceCertificate.Subject
              extensions = @(
                $certificate.Extensions | ForEach-Object {
                  [ordered]@{
                    oid = $_.Oid.Value
                    friendlyName = $_.Oid.FriendlyName
                    formatted = $_.Format($true)
                  }
                }
              )
            }
            $trustEvidence.status = "passed"
            $trustEvidence.completedAt = [DateTime]::UtcNow.ToString("o")
            Write-TrustEvidence
          } catch {
            $trustEvidence.status = "failed"
            $trustEvidence.error = $_.Exception.Message
            Write-TrustMarker "trust-setup-failed" "Certificate trust setup stopped before the signing verification phase."
            throw
          }
      - name: Retain Windows certificate trust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-windows-certificate-trust-evidence
          path: windows-certificate-trust-evidence.json
          if-no-files-found: warn
      - run: pnpm --filter @workspace/lee-desktop run package
        env:
          CSC_KEY_PASSWORD: ${{ secrets.LEE_WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $installers = Get-ChildItem artifacts/lee-desktop/release/*.exe -File
          if ($installers.Count -eq 0) { throw "No Windows installer was produced." }
          $publicCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            (Resolve-Path "artifacts/lee-desktop/resources/lee-signing.cer").Path
          )
          $expectedThumbprint = $publicCertificate.Thumbprint.ToUpperInvariant()
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($null -eq $signature.SignerCertificate) {
              throw "$($installer.Name) has no Authenticode signer certificate."
            }
            if ($signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) {
              throw "$($installer.Name) is signed by an unexpected certificate: $($signature.SignerCertificate.Thumbprint)."
            }
            if ($signature.Status -notin @("Valid", "Unknown", "UnknownError")) {
              throw "$($installer.Name) has an invalid Authenticode signature status: $($signature.Status)."
            }
          }
      - name: Write Windows release metadata
        run: node artifacts/lee-desktop/scripts/write-release-manifest.mjs --platform windows
      - name: Confirm checksums
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/lee-desktop/release/SHA256SUMS-windows.txt)) { throw "Windows checksum manifest is missing." }
      - name: Upload installer for validation
        uses: actions/upload-artifact@v4
        with:
          name: lee-windows-installer
          path: |
            artifacts/lee-desktop/release/*.exe
            artifacts/lee-desktop/release/*.yml
            artifacts/lee-desktop/release/*.blockmap
            artifacts/lee-desktop/release/*.sha256
            artifacts/lee-desktop/release/SHA256SUMS-windows.txt
            artifacts/lee-desktop/release/release-manifest-windows.json
          if-no-files-found: error

  linux-package:
    needs: validate-release-ref
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set release version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == lee-v* ]]; then
            VERSION="${GITHUB_REF_NAME#lee-v}"
            node -e "const fs=require('fs'); const p='artifacts/lee-desktop/package.json'; const data=JSON.parse(fs.readFileSync(p,'utf8')); data.version=process.argv[1]; fs.writeFileSync(p, JSON.stringify(data,null,2)+'\n')" "$VERSION"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-zod exec tsc -p tsconfig.json
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/lee-console run build
        env:
          PORT: 4173
          BASE_PATH: /
      - name: Stage private PostgreSQL runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql
          initdb_path="$(find /usr/lib/postgresql -path '*/bin/initdb' -type f -print | sort -V | tail -n 1)"
          test -n "$initdb_path"
          postgres_root="$(dirname "$(dirname "$initdb_path")")"
          postgres_major="$(basename "$postgres_root")"
          node artifacts/lee-desktop/scripts/stage-postgres-runtime.mjs \
            --platform linux \
            --source "$postgres_root" \
            --share-source "/usr/share/postgresql/$postgres_major"
      - name: Build Linux packages
        run: pnpm --filter @workspace/lee-desktop run package
      - name: Build unpacked Linux app for runtime smoke test
        run: pnpm --filter @workspace/lee-desktop exec electron-builder --config electron-builder.yml --dir --publish never
      - name: Verify packaged Linux migration assets
        run: node artifacts/lee-desktop/scripts/verify-packaged-migrations.mjs --resources-root artifacts/lee-desktop/release/linux-unpacked/resources --source-file artifacts/lee-desktop/src/runtime.ts --platform linux
      - name: Smoke test bundled Linux runtime
        shell: bash
        timeout-minutes: 12
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb
          command -v xvfb-run >/dev/null || { echo "xvfb-run is required for the Linux desktop smoke test." >&2; exit 1; }
          evidence_dir="release/unix-runtime-smoke-linux-evidence"
          mkdir -p "$evidence_dir"
          console_log="$evidence_dir/console.log"
          process_state="$evidence_dir/process-state.txt"
          command_status="$evidence_dir/command-status.txt"
          set +e
          timeout --foreground --signal=TERM --kill-after=30s 10m \
            xvfb-run --auto-servernum --server-args="-screen 0 1440x960x24" \
            pnpm --filter @workspace/lee-desktop run smoke:unix -- release/linux-unpacked/Project-LEE --evidence release/unix-runtime-smoke-linux.json \
            2>&1 | tee "$console_log"
          smoke_status=${PIPESTATUS[0]}
          set -e
          ps -eo pid=,ppid=,stat=,etime=,args= > "$process_state" || true
          printf 'exit_code=%s\n' "$smoke_status" > "$command_status"
          if [[ "$smoke_status" -eq 124 || "$smoke_status" -eq 137 ]]; then
            printf 'outer_timeout=true\n' >> "$command_status"
            if [[ ! -s release/unix-runtime-smoke-linux.json ]]; then
              node - "$console_log" "$process_state" release/unix-runtime-smoke-linux.json "$smoke_status" <<'NODE'
          const fs = require("node:fs");
          const [consolePath, processPath, evidencePath, status] = process.argv.slice(2);
          const read = (path) => {
            try { return fs.readFileSync(path, "utf8").slice(-32768); } catch (error) { return `Unable to read ${path}: ${error.message}`; }
          };
          const consoleOutput = read(consolePath);
          const phases = [...consoleOutput.matchAll(/\[unix-runtime-smoke\] phase: ([^\r\n]+)/g)].map((match) => match[1]);
          const lastPhase = phases.at(-1) ?? "outer-timeout";
          fs.writeFileSync(evidencePath, `${JSON.stringify({
            platform: "linux",
            status: "failed",
            phase: lastPhase,
            timedOut: true,
            error: { message: `Linux runtime smoke exceeded its outer timeout (exit ${status}).` },
            child: { output: consoleOutput, processState: read(processPath) },
            processState: read(processPath),
          }, null, 2)}\n`);
          NODE
            fi
          fi
          exit "$smoke_status"
        env:
          LEE_SMOKE_NO_SANDBOX: "1"
      - name: Retain Linux runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-linux-runtime-smoke-evidence
          path: artifacts/lee-desktop/release/unix-runtime-smoke-linux.json
          if-no-files-found: warn
      - name: Write Linux release metadata
        run: node artifacts/lee-desktop/scripts/write-release-manifest.mjs --platform linux
      - name: Verify Linux release metadata
        run: node artifacts/lee-desktop/scripts/verify-release-manifests.mjs artifacts/lee-desktop/release
      - uses: actions/upload-artifact@v4
        with:
          name: lee-linux-installers
          path: |
            artifacts/lee-desktop/release/*.AppImage
            artifacts/lee-desktop/release/*.deb
            artifacts/lee-desktop/release/*.rpm
            artifacts/lee-desktop/release/*.tar.gz
            artifacts/lee-desktop/release/*.yml
            artifacts/lee-desktop/release/*.blockmap
            artifacts/lee-desktop/release/*.sha256
            artifacts/lee-desktop/release/SHA256SUMS-linux.txt
            artifacts/lee-desktop/release/release-manifest-linux.json
            artifacts/lee-desktop/release/unix-runtime-smoke-linux.json
          if-no-files-found: error

  windows-installer-validation:
    needs: windows-installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: lee-windows-installer
          path: ${{ runner.temp }}/lee-installer
      - name: Validate clean non-admin Windows installation
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP\lee-installer\*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Downloaded NSIS installer is missing." }
          $userName = "lee-smoke-owner"
          $password = ConvertTo-SecureString "$([guid]::NewGuid().ToString('N'))!aA1" -AsPlainText -Force
          $evidencePath = Join-Path $env:RUNNER_TEMP "windows-smoke-evidence.json"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "windows-smoke-owner.stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "windows-smoke-owner.stderr.log"
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "artifacts\lee-desktop\scripts\windows-smoke-test.ps1"
          New-LocalUser -Name $userName -Password $password -AccountNeverExpires -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
          try {
            $credential = [System.Management.Automation.PSCredential]::new(".\$userName", $password)
            $process = Start-Process -FilePath "pwsh.exe" `
              -Credential $credential `
              -LoadUserProfile `
              -WorkingDirectory $env:GITHUB_WORKSPACE `
              -ArgumentList @(
                "-NoProfile",
                "-NonInteractive",
                "-ExecutionPolicy", "Bypass",
                "-File", $scriptPath,
                "-InstallerPath", $installer.FullName,
                "-EvidencePath", $evidencePath,
                "-RequireNonAdmin",
                "-ExpectedUserName", $userName
              ) `
              -RedirectStandardOutput $stdoutPath `
              -RedirectStandardError $stderrPath `
              -Environment @{ LEE_SMOKE_PASSWORD = "$([System.Net.NetworkCredential]::new('', $password).Password)" } `
              -Wait `
              -PassThru
            if ($process.ExitCode -ne 0) {
              if (Test-Path $stdoutPath) { Get-Content $stdoutPath }
              if (Test-Path $stderrPath) { Get-Content $stderrPath }
              throw "Clean non-admin Windows installer smoke test exited with $($process.ExitCode)."
            }
          } finally {
            if (Test-Path $evidencePath) {
              Copy-Item $evidencePath "$env:GITHUB_WORKSPACE\windows-smoke-evidence.json" -Force
            }
            Remove-LocalUser -Name $userName -ErrorAction SilentlyContinue
          }
      - name: Retain Windows installer smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-windows-installer-smoke-evidence
          path: windows-smoke-evidence.json
          if-no-files-found: warn

  publish-release:
    needs:
      - windows-installer-validation
      - linux-package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lee-windows-installer
          path: artifacts/lee-desktop/release
      - uses: actions/download-artifact@v4
        with:
          name: lee-linux-installers
          path: artifacts/lee-desktop/release
      - name: Verify all release manifests and checksums
        shell: bash
        run: node artifacts/lee-desktop/scripts/verify-release-manifests.mjs artifacts/lee-desktop/release
      - name: Confirm updater metadata is complete
        shell: pwsh
        run: |
          foreach ($metadata in @("latest.yml", "latest-linux.yml")) {
            if (-not (Test-Path "artifacts/lee-desktop/release/$metadata")) { throw "Missing electron-updater metadata: $metadata" }
          }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/lee-desktop/release/*
          generate_release_notes: true

  signed-update-validation:
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/lee-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            evidence_suffix: windows
          - platform: linux
            runner: ubuntu-latest
            evidence_suffix: linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download published current and previous stable releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/lee-update/current" "$RUNNER_TEMP/lee-update/previous"
          node artifacts/lee-desktop/scripts/download-release-assets.mjs \
            --platform "${{ matrix.platform }}" \
            --current-dir "$RUNNER_TEMP/lee-update/current" \
            --previous-dir "$RUNNER_TEMP/lee-update/previous" \
            --record "$RUNNER_TEMP/lee-update/selection.json"
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); fs.appendFileSync(process.env.GITHUB_ENV, `LEE_UPDATE_VERSION=${r.currentVersion}\n`, "utf8")' "$RUNNER_TEMP/lee-update/selection.json"
      - name: Verify Windows signed update installation
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\artifacts\lee-desktop\scripts\windows-update-smoke.ps1" `
            -CurrentDir "$env:RUNNER_TEMP\lee-update\current" `
            -PreviousDir "$env:RUNNER_TEMP\lee-update\previous" `
            -ExpectedVersion "$env:LEE_UPDATE_VERSION" `
            -Output "$env:GITHUB_WORKSPACE\update-verification-${{ matrix.evidence_suffix }}.json" `
            -Selection "$env:RUNNER_TEMP\lee-update\selection.json"
      - name: Verify Linux signed update installation
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb
          command -v xvfb-run >/dev/null 2>&1 || { echo "xvfb-run is required for Linux updater validation." >&2; exit 1; }
          xvfb-run --auto-servernum --server-args="-screen 0 1440x960x24" \
            node artifacts/lee-desktop/scripts/unix-update-smoke.mjs \
            --platform linux \
            --current-dir "$RUNNER_TEMP/lee-update/current" \
            --previous-dir "$RUNNER_TEMP/lee-update/previous" \
            --expected-version "$LEE_UPDATE_VERSION" \
            --record "$RUNNER_TEMP/lee-update/selection.json" \
            --output "$GITHUB_WORKSPACE/update-verification-${{ matrix.evidence_suffix }}.json"
      - name: Write signed update verification checklist
        shell: bash
        run: |
          node artifacts/lee-desktop/scripts/write-update-verification-checklist.mjs \
            --input "$GITHUB_WORKSPACE/update-verification-${{ matrix.evidence_suffix }}.json" \
            --output "$GITHUB_WORKSPACE/UPDATE-VERIFICATION-${{ matrix.evidence_suffix }}.md"
      - uses: actions/upload-artifact@v4
        with:
          name: lee-update-verification-${{ matrix.evidence_suffix }}
          path: |
            update-verification-${{ matrix.evidence_suffix }}.json
            UPDATE-VERIFICATION-${{ matrix.evidence_suffix }}.md
          if-no-files-found: error
      - name: Retain verification evidence with the published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "update-verification-${{ matrix.evidence_suffix }}.json" "UPDATE-VERIFICATION-${{ matrix.evidence_suffix }}.md" --clobber